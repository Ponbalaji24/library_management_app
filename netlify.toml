[build]
  command = "python build.py"
  publish = "dist"

# Redirect /api/* to backend — BACKEND_API_URL is set as Netlify env var during build
# The _redirects file generated by build.py handles this at runtime.

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
